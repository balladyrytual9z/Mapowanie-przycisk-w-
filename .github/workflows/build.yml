
name: Build Mapowanie przycisków

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Znajdź projekt Gradle
        id: project
        shell: bash
        run: |
          FILE="$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$FILE" ]; then
            echo "::error::Nie znaleziono settings.gradle ani settings.gradle.kts."
            echo "Zawartość repozytorium:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          DIR="$(dirname "$FILE")"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Znaleziono projekt Gradle w: $DIR"

      - name: Zainstaluj Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kompiluj APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Znajdź i opublikuj APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mapowanie-przyciskow-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

