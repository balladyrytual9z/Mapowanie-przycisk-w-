
name: Build ESSGOO Key Mapper

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack project ZIP
        shell: bash
        run: |
          set -e
          ZIP="ESSGOO-KeyMapper-Integrated.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Nie znaleziono pliku $ZIP"
            find . -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p project
          unzip -o "$ZIP" -d project

          echo "Pliki po rozpakowaniu:"
          find project -maxdepth 5 -type f | sort

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -e
          FILE="$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$FILE" ]; then
            echo "::error::ZIP nie zawiera settings.gradle."
            exit 1
          fi

          DIR="$(dirname "$FILE")"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Projekt: $DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESSGOO-KeyMapper-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
