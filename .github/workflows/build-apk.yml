name: Build and publish ESSGOO Quick Switch

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: essgoo-quick-switch-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed Android APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not use android-actions/setup-android here:
      # that action may request the obsolete SDK package "tools".
      - name: Locate Android SDK and install required packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "ERROR: Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools."
            echo "Available cmdline-tools directories:"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type d -print 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          # Accept licences without allowing 'yes' SIGPIPE to fail the step.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          echo "Android SDK packages installed."

      - name: Select project folder or uploaded ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
            echo "Building Gradle project from repository root."
          else
            ZIP_PATH="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '*.zip' | head -n 1 || true)"

            if [[ -z "$ZIP_PATH" ]]; then
              ZIP_PATH="$(find . -maxdepth 3 -type f -name '*.zip' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2- | sed 's#^./##')"
            fi

            if [[ -z "$ZIP_PATH" || ! -f "$ZIP_PATH" ]]; then
              echo "ERROR: No Gradle project at repository root and no source ZIP found."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/quick-switch-source"
            unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/quick-switch-source"

            SETTINGS_FILE="$(find "$RUNNER_TEMP/quick-switch-source" -maxdepth 6 \( -name settings.gradle -o -name settings.gradle.kts \) -type f | head -n 1)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: ZIP $ZIP_PATH does not contain settings.gradle or settings.gradle.kts."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            echo "Building project extracted from $ZIP_PATH"
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle" && ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ERROR: app Gradle build file not found in $PROJECT_DIR."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Selected project: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace clean assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -s "$APK" ]]; then
            echo "ERROR: Release APK was not generated: $APK"
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$APK" "$RUNNER_TEMP/release-assets/ESSGOO-Quick-Switch-${GITHUB_RUN_NUMBER}.apk"
          (
            cd "$RUNNER_TEMP/release-assets"
            sha256sum "ESSGOO-Quick-Switch-${GITHUB_RUN_NUMBER}.apk" > SHA256SUMS.txt
          )

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESSGOO-Quick-Switch-${{ github.run_number }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-${{ github.run_attempt }}
          name: ESSGOO Quick Switch v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release-assets/ESSGOO-Quick-Switch-${{ github.run_number }}.apk
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt
